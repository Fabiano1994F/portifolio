<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Portfólio | Fabiano Santos</title>
    <link rel="stylesheet" href="styles.css">


    <script src="components/navbar.js" defer></script>

    <script src="components/about-section.js" defer></script>
    <script src="components/project-card.js" defer></script>

        <h2 class="projetos-titulo">Tecnologias & Skills</h2>
        <div class="skills-container">

            <div class="skill-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" alt="HTML 5"
                    width="50">
                <span>HTML 5</span>
            </div>

            <div class="skill-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg" alt="CSS 3"
                    width="50">
                <span>CSS 3</span>
            </div>

            <div class="skill-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg"
                    alt="JavaScript" width="50">
                <span>JavaScript</span>
            </div>

            <div class="skill-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python"
                    width="50">
                <span>Python</span>
            </div>

            <div class="skill-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nextjs/nextjs-original.svg" alt="Next.js"
                    width="50" style="background: white; border-radius: 50%;">
                <span>Next.js</span>
            </div>

            <div class="skill-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/supabase/supabase-original.svg"
                    alt="Supabase" width="50">
                <span>Supabase & SQL</span>
            </div>

            <div class="skill-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg"
                    alt="Git" width="50">
                <span>Git</span>
            </div>

            <div class="skill-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg"
                    alt="GitHub" width="50">
                <span>GitHub</span>
            </div>

        </div>
